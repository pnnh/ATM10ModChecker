name: Release

# 触发规则：
#  * push tag：只有在打 tag 时才自动构建并发布 Release，标签必须是严格语义化版本
#    （vMAJOR.MINOR.PATCH，可选 -PRERELEASE 与 +BUILD，例如 v1.1.0 / v1.2.0-rc1）；
#  * workflow_dispatch：只允许在 main 分支手动运行，构建 + 制品证明，**不**发布 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write        # 创建 Release 并上传附件
  id-token: write        # OIDC：生成构建溯源签名
  attestations: write    # 写入 Artifact Attestations

env:
  PYTHON_VERSION: "3.12"
  APP_NAME: ATM10ModChecker

jobs:
  # ---------------------------------------------------------------- 触发条件校验
  validate:
    name: Validate trigger
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check branch / tag
        id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # 手动运行：仅限 main 分支，只构建不发布
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Manual runs are only allowed on the main branch (current ref: $REF)"
              exit 1
            fi
            echo "Manual run on main: build and attest only, no release will be published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 打 tag 运行：必须是语义化版本
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::Tag '$TAG' is not a semantic version tag. Expected vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD], e.g. v1.1.0 or v1.2.0-rc1."
            exit 1
          fi
          echo "Tag $TAG accepted, a GitHub Release will be published."
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- 双平台构建
  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            slug: windows-x64
            binary: ATM10ModChecker.exe
          - os: ubuntu-22.04
            label: Linux x64
            slug: linux-x64
            binary: ATM10ModChecker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.6,<7"

      - name: Check tag matches __version__
        if: needs.validate.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from modchecker import __version__

          tag = os.environ["TAG"]
          # 允许 v1.2.0-rc1 这类与 1.2.0 对应的预发布标签
          ok = tag == __version__ or tag.startswith(__version__ + "-")
          print(f"tag={tag!r} __version__={__version__!r} match={ok}")
          raise SystemExit(0 if ok else 1)
          PY

      - name: Compile check
        run: python -m compileall -q modchecker main.py

      - name: Build single-file executable
        shell: bash
        run: |
          args=(--noconfirm --clean --onefile --name "$APP_NAME"
                --exclude-module tkinter --exclude-module unittest
                --exclude-module pydoc --exclude-module doctest
                --exclude-module pytest --exclude-module setuptools)
          # 打包后的程序双击即可启动：Windows 用窗口子系统，避免弹出黑框
          if [ "$RUNNER_OS" = "Windows" ]; then
            args+=(--windowed)
          fi
          pyinstaller "${args[@]}" main.py

      - name: Prepare release files
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          SLUG: ${{ matrix.slug }}
        run: |
          # 用 Python 打包 zip：跨平台一致，并且能显式写入可执行权限
          python - <<'PY'
          import os, pathlib, time, zipfile

          slug = os.environ["SLUG"]
          binary = pathlib.Path(os.environ["BINARY"])
          dist = pathlib.Path("dist") / binary
          release = pathlib.Path("release")
          release.mkdir(exist_ok=True)
          stamp = time.localtime()[:6]

          suffix = ".exe" if dist.suffix == ".exe" else ""
          loose = release / f"ATM10ModChecker-{slug}{suffix}"
          loose.write_bytes(dist.read_bytes())
          if suffix == "":
              loose.chmod(0o755)

          # 随包附带协议文本：AGPL 与本项目，以及 Qt/PySide6 的 LGPL
          members = [
              (binary.name, dist, 0o755),
              ("LICENSE", pathlib.Path("LICENSE"), 0o644),
              ("THIRD-PARTY-NOTICES.md", pathlib.Path("THIRD-PARTY-NOTICES.md"), 0o644),
              ("README.md", pathlib.Path("README.md"), 0o644),
              ("README.zh-CN.md", pathlib.Path("README.zh-CN.md"), 0o644),
              ("licenses/GPL-3.0.txt", pathlib.Path("licenses/GPL-3.0.txt"), 0o644),
              ("licenses/LGPL-3.0.txt", pathlib.Path("licenses/LGPL-3.0.txt"), 0o644),
          ]

          archive = release / f"ATM10ModChecker-{slug}.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
              for name, path, mode in members:
                  if not path.exists():
                      continue
                  info = zipfile.ZipInfo(name, date_time=stamp)
                  info.external_attr = (0o100000 | mode) << 16   # 普通文件 + 权限
                  info.compress_type = zipfile.ZIP_DEFLATED
                  zf.writestr(info, path.read_bytes())
              info = zipfile.ZipInfo("RUNNING.txt", date_time=stamp)
              info.external_attr = (0o100000 | 0o644) << 16
              zf.writestr(info,
                          "Windows: double-click ATM10ModChecker.exe\n"
                          "Linux:   chmod +x ATM10ModChecker && ./ATM10ModChecker\n"
                          "\n"
                          "Settings, cache and logs live in the .ATM10ModChecker folder next to\n"
                          "the executable. To uninstall, delete the executable and that folder.\n"
                          "\n"
                          "License: AGPL-3.0-or-later (see LICENSE).\n"
                          "Source : https://github.com/pnnh/mcmodchecker\n")
          print(f"built {loose.name} ({loose.stat().st_size} bytes)")
          print(f"built {archive.name} ({archive.stat().st_size} bytes)")
          PY
          ls -lh release

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          chmod +x "dist/${{ matrix.binary }}"
          QT_QPA_PLATFORM=offscreen "dist/${{ matrix.binary }}" --version
          # 设置 / 缓存 / 日志都应落在可执行文件旁的 .ATM10ModChecker 里
          test -f "dist/.ATM10ModChecker/logs/latest.log" && tail -n 5 "dist/.ATM10ModChecker/logs/latest.log"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist\${{ matrix.binary }}" --version
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed with exit code $LASTEXITCODE" }
          $log = "dist\.ATM10ModChecker\logs\latest.log"
          if (-not (Test-Path $log)) { throw "Expected log next to the executable: $log" }

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          # 覆盖 release/ 下的可执行文件与压缩包，用户可用
          # gh attestation verify <file> --repo <owner>/<repo> 校验
          subject-path: "release/*"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- 发布 Release
  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    # 仅 tag 触发时发布；main 分支手动运行只产出 artifact
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download built files
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: ls -lh artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          append_body: true
          body: |
            ## Download / 下载

            | Platform | File | How to run |
            | -------- | ---- | ---------- |
            | Windows x64 | `ATM10ModChecker-windows-x64.exe` | 双击运行 / double-click |
            | Windows x64 | `ATM10ModChecker-windows-x64.zip` | 解压后双击 `ATM10ModChecker.exe` |
            | Linux x64 | `ATM10ModChecker-linux-x64.zip` | 解压后 `./ATM10ModChecker` |
            | Linux x64 | `ATM10ModChecker-linux-x64` | `chmod +x` 后运行 |

            程序已自带 Python 与 Qt 运行库，无需安装任何依赖（自包含单文件）。
            The executable bundles Python and Qt, so no extra dependencies are needed.

            > **Personal hobby project / 个人兴趣项目**：mostly built together with AI assistants,
            > not rigorously tested, and only validated against the All the Mods 10 pack.
            > 请先备份实例再使用；其它整合包与原版实例未经验证。
            > Licensed under AGPL-3.0-or-later — full text in the `LICENSE` file inside each archive.

            ## Build provenance / 构建溯源

            所有附件都附带 GitHub Artifact Attestation（SLSA build provenance）。
            Every asset ships with a GitHub Artifact Attestation, verifiable with the GitHub CLI:

            ```bash
            gh attestation verify ATM10ModChecker-windows-x64.exe --repo ${{ github.repository }}
            gh attestation verify ATM10ModChecker-linux-x64.zip --repo ${{ github.repository }}
            ```
